<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 12 - findLongestWord</title>
  </head>
  <body>
    <h2>Bài 12:</h2>
    <label for="arrayInput">Nhập danh sách từ (cách nhau bởi dấu phẩy):</label>
    <br />
    <input type="text" id="arrayInput" value="apple, banana, cherry, date" style="width: 350px" />
    <button onclick="handleCalculate()">Tìm từ dài nhất</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function findLongestWord(words) {
        if (words.length === 0) return "";
        let longest = words[0];
        for (let i = 1; i < words.length; i++) {
          if (words[i].length > longest.length) {
            longest = words[i];
          }
        }
        return longest;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let words = rawInput
          .replace(/[\[\]"]/g, "")
          .split(",")
          .map((item) => item.trim())
          .filter((item) => item.length > 0);
        let res = findLongestWord(words);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
