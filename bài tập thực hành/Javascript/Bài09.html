<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 09</title>
  </head>
  <body>
    <script>
      function alternateSum(arr) {
        let total = 0;
        for (let i = 0; i < arr.length; i++) {
          if (i % 2 === 0) {
            total += arr[i];
          } else {
            total -= arr[i];
          }
        }
        return total;
      }
      document.write("<p>Mảng [10, 5, 6, 3] ➔ Tổng xen kẽ: <b>" + alternateSum([10, 5, 6, 3]) + "</b></p>");
      document.write("<p>Mảng [1, 2, 3, 4, 5] ➔ Tổng xen kẽ: <b>" + alternateSum([1, 2, 3, 4, 5]) + "</b></p>");
    </script>
  </body>
</html>
