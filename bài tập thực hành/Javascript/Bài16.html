<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 16</title>
  </head>
  <body>
    <script>
      function findPairsWithSum(arr, sum) {
        let pairs = [];
        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] + arr[j] === sum) {
              pairs.push("[" + arr[i] + ", " + arr[j] + "]");
            }
          }
        }
        return pairs;
      }
      document.write(
        "<p>Các cặp có tổng = 5 từ [1, 2, 3, 4, 5] ➔ <b>[" +
          findPairsWithSum([1, 2, 3, 4, 5], 5).join(", ") +
          "]</b></p>",
      );
    </script>
  </body>
</html>
