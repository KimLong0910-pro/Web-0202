<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 06 - calculateAverage</title>
  </head>
  <body>
    <h2>Bài 06:</h2>
    <label for="arrayInput">Nhập mảng (cách nhau bởi dấu phẩy):</label>
    <br />
    <input type="text" id="arrayInput" value="10, 20, 30, 40, 50" style="width: 300px" />
    <button onclick="handleCalculate()">Tính trung bình cộng</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function calculateAverage(arr) {
        if (arr.length === 0) return 0;
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
          sum += arr[i];
        }
        return sum / arr.length;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let arr =
          rawInput.trim() === ""
            ? []
            : rawInput
                .replace(/[\[\]]/g, "")
                .split(",")
                .map((item) => Number(item.trim()))
                .filter((item) => !isNaN(item));
        let res = calculateAverage(arr);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
