<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 02</title>
  </head>
  <body>
    <script>
      function sumOddNumbers(arr) {
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] % 2 !== 0) {
            sum += arr[i];
          }
        }
        return sum;
      }
      document.write("<p>Mảng [1, 2, 3, 4, 5] ➔ Tổng số lẻ: <b>" + sumOddNumbers([1, 2, 3, 4, 5]) + "</b></p>");
    </script>
  </body>
</html>
