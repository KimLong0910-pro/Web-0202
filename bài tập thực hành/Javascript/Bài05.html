<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 05</title>
  </head>
  <body>
    <script>
      function sumArray(arr) {
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
          sum += arr[i];
        }
        return sum;
      }
      document.write("<p>Mảng [1, 2, 3, 4, 5] ➔ Tổng mảng: <b>" + sumArray([1, 2, 3, 4, 5]) + "</b></p>");
    </script>
  </body>
</html>
