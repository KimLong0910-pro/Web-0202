<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 01</title>
  </head>
  <body>
    <script>
      function findMax(arr) {
        let maxVal = arr[0];
        for (let i = 1; i < arr.length; i++) {
          if (arr[i] > maxVal) {
            maxVal = arr[i];
          }
        }
        return maxVal;
      }
      document.write("<p>Mảng [1, 3, 5, 7, 9] ➔ Số lớn nhất: <b>" + findMax([1, 3, 5, 7, 9]) + "</b></p>");
      document.write("<p>Mảng [10, 20, 30, 40, 50] ➔ Số lớn nhất: <b>" + findMax([10, 20, 30, 40, 50]) + "</b></p>");
      document.write("<p>Mảng [-5, -2, -1, -3] ➔ Số lớn nhất: <b>" + findMax([-5, -2, -1, -3]) + "</b></p>");
    </script>
  </body>
</html>
