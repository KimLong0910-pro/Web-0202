<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 14</title>
  </head>
  <body>
    <script>
      function findMissingNumber(arr, n) {
        let expectedSum = (n * (n + 1)) / 2;
        let actualSum = 0;
        for (let i = 0; i < arr.length; i++) {
          actualSum += arr[i];
        }
        return expectedSum - actualSum;
      }
      document.write("<p>Thiếu trong [1, 2, 4, 5, 6] (n=6) ➔ <b>" + findMissingNumber([1, 2, 4, 5, 6], 6) + "</b></p>");
      document.write(
        "<p>Thiếu trong [3, 7, 1, 2, 8, 4, 5] (n=8) ➔ <b>" + findMissingNumber([3, 7, 1, 2, 8, 4, 5], 8) + "</b></p>",
      );
      document.write("<p>Thiếu trong [1, 2, 3, 4] (n=4) ➔ <b>" + findMissingNumber([1, 2, 3, 4], 4) + "</b></p>");
    </script>
  </body>
</html>
