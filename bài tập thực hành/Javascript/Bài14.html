<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 14 - findMissingNumber</title>
  </head>
  <body>
    <h2>Bài 14:</h2>
    <label for="arrayInput">Nhập mảng thiếu 1 số:</label>
    <br />
    <input type="text" id="arrayInput" value="1, 2, 4, 5, 6" style="width: 300px" />
    <br />
    <br />
    <label for="nInput">Nhập n (độ dài dãy đúng):</label>
    <br />
    <input type="number" id="nInput" value="6" />
    <br />
    <br />
    <button onclick="handleCalculate()">Tìm số thiếu</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function findMissingNumber(arr, n) {
        let expectedSum = (n * (n + 1)) / 2;
        let actualSum = 0;
        for (let i = 0; i < arr.length; i++) {
          actualSum += arr[i];
        }
        return expectedSum - actualSum;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let n = Number(document.getElementById("nInput").value);
        let arr = rawInput
          .replace(/[\[\]]/g, "")
          .split(",")
          .map((item) => Number(item.trim()))
          .filter((item) => !isNaN(item));
        let res = findMissingNumber(arr, n);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
