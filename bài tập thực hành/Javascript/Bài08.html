<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 08</title>
  </head>
  <body>
    <script>
      function countGreaterThan(arr, value) {
        let count = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > value) {
            count++;
          }
        }
        return count;
      }
      document.write(
        "<p>Mảng [1, 5, 7, 2, 3] lớn hơn 3 ➔ Số lượng: <b>" + countGreaterThan([1, 5, 7, 2, 3], 3) + "</b></p>",
      );
      document.write(
        "<p>Mảng [2, 3, 1, -6, 8] lớn hơn 5 ➔ Số lượng: <b>" + countGreaterThan([2, 3, 1, -6, 8], 5) + "</b></p>",
      );
      document.write("<p>Mảng [] lớn hơn 5 ➔ Số lượng: <b>" + countGreaterThan([], 5) + "</b></p>");
    </script>
  </body>
</html>
