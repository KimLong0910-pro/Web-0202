<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 13 - calculateGrade</title>
  </head>
  <body>
    <h2>Bài 13:</h2>
    <label for="arrayInput">Nhập danh sách điểm (cách nhau bởi dấu phẩy):</label>
    <br />
    <input type="text" id="arrayInput" value="90, 95, 88" style="width: 300px" />
    <button onclick="handleCalculate()">Tính xếp loại</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function calculateGrade(scores) {
        if (scores.length === 0) return "F";
        let sum = 0;
        for (let i = 0; i < scores.length; i++) {
          sum += scores[i];
        }
        let avg = sum / scores.length;

        if (avg >= 90) return "A";
        if (avg >= 80) return "B";
        if (avg >= 70) return "C";
        if (avg >= 60) return "D";
        return "F";
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let scores = rawInput
          .replace(/[\[\]]/g, "")
          .split(",")
          .map((item) => Number(item.trim()))
          .filter((item) => !isNaN(item));
        let res = calculateGrade(scores);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
