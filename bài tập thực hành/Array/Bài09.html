<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 09 - alternateSum</title>
  </head>
  <body>
    <h2>Bài 09:</h2>
    <label for="arrayInput">Nhập mảng (cách nhau bởi dấu phẩy):</label>
    <br />
    <input type="text" id="arrayInput" value="10, 5, 6, 3" style="width: 300px" />
    <button onclick="handleCalculate()">Tính tổng xen kẽ</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function alternateSum(arr) {
        let total = 0;
        for (let i = 0; i < arr.length; i++) {
          if (i % 2 === 0) {
            total += arr[i];
          } else {
            total -= arr[i];
          }
        }
        return total;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let arr = rawInput
          .replace(/[\[\]]/g, "")
          .split(",")
          .map((item) => Number(item.trim()))
          .filter((item) => !isNaN(item));
        let res = alternateSum(arr);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
