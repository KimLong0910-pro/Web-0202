<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 15 - removeDuplicates</title>
  </head>
  <body>
    <h2>Bài 15:</h2>
    <label for="arrayInput">Nhập mảng (cách nhau bởi dấu phẩy):</label>
    <br />
    <input type="text" id="arrayInput" value="1, 2, 2, 3, 4, 4, 5" style="width: 300px" />
    <button onclick="handleCalculate()">Lọc trùng</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function removeDuplicates(arr) {
        let result = [];
        for (let i = 0; i < arr.length; i++) {
          if (!result.includes(arr[i])) {
            result.push(arr[i]);
          }
        }
        return result;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let arr = rawInput
          .replace(/[\[\]]/g, "")
          .split(",")
          .map((item) => Number(item.trim()))
          .filter((item) => !isNaN(item));
        let res = removeDuplicates(arr);
        document.getElementById("result").innerText = "[" + res.join(", ") + "]";
      }
    </script>
  </body>
</html>
