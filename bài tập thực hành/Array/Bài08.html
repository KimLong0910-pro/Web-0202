<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 08 - countGreaterThan</title>
  </head>
  <body>
    <h2>Bài 08:</h2>
    <label for="arrayInput">Nhập mảng:</label>
    <br />
    <input type="text" id="arrayInput" value="1, 5, 7, 2, 3" style="width: 300px" />
    <br />
    <br />
    <label for="valInput">Nhập giá trị so sánh (value):</label>
    <br />
    <input type="number" id="valInput" value="3" />
    <br />
    <br />
    <button onclick="handleCalculate()">Đếm số phần tử lớn hơn</button>

    <p>
      Kết quả:
      <b id="result">--</b>
    </p>

    <script>
      function countGreaterThan(arr, value) {
        let count = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > value) {
            count++;
          }
        }
        return count;
      }

      function handleCalculate() {
        let rawInput = document.getElementById("arrayInput").value;
        let value = Number(document.getElementById("valInput").value);
        let arr =
          rawInput.trim() === ""
            ? []
            : rawInput
                .replace(/[\[\]]/g, "")
                .split(",")
                .map((item) => Number(item.trim()))
                .filter((item) => !isNaN(item));
        let res = countGreaterThan(arr, value);
        document.getElementById("result").innerText = res;
      }
    </script>
  </body>
</html>
