<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương trình tính tuổi</title>
</head>
<body>
    <h2>Chương trình tính tuổi</h2>
    <label for="namsinh">Nhập năm sinh của bạn:</label>
    <input type="number" id="namsinh">
    <br><br>
    <button onclick="tinhTuoi()">Tính tuổi</button>
    <h3 id="ketqua"></h3>
    <script>
        function tinhTuoi(){
            let yourBirth = Number(document.getElementById("namsinh").value);
            let currentYear = new Date().getFullYear();
            let age = currentYear - yourBirth;
            document.getElementById("ketqua").innerHTML = "Tuổi của bạn là: " + age;
        }
    </script>
</body>
</html>
